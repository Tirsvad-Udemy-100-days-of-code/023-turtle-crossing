# Run the tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2
      - name: Set up Python 3.13
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - name: Install a virtual display and Tk
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install the development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Run the tests
        run: xvfb-run python -m pytest
